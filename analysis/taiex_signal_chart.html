  document.getElementById('sp').innerHTML=`<div class="sc"><h4>▲ 買入（${d.bt.length}筆）</h4>${bR}</div><div class="sc"><h4>▼ 賣出（${d.st.length}筆）</h4>${sR}</div>`;
  document.getElementById('sc2').textContent=`買${d.bt.length} 賣${d.st.length}`;
}
function sw(k,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');render(k);}
render('d');
</script>
</body>
