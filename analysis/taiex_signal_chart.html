<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台指期 策略訊號 K 線圖 | QuantDinger</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#0d1117;--sf:#161b22;--bd:#30363d;--tx:#e6edf3;--mt:#8b949e;--bu:#26a641;--br:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif}
header{background:linear-gradient(135deg,#0d1117,#1a1f2e);border-bottom:1px solid var(--bd);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:1.15rem;font-weight:700}
header p{font-size:.75rem;color:var(--mt);margin-top:3px}
.live{display:flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;color:#4ade80;background:#0f2a1a;border:1px solid #166534;padding:3px 10px;border-radius:20px}
.pulse{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs{display:flex;gap:3px}
.tab{padding:5px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:600;border:1px solid var(--bd);background:transparent;color:var(--mt)}
.tab.active{background:#1f6feb;border-color:#388bfd;color:#fff}
.info{margin-left:auto;display:flex;gap:10px;font-size:.75rem;color:var(--mt)}
.chip{display:flex;align-items:center;gap:4px;background:#21262d;border:1px solid var(--bd);padding:2px 8px;border-radius:5px}
.dg{width:7px;height:7px;border-radius:50%;background:var(--bu)}
.dr{width:7px;height:7px;border-radius:50%;background:var(--br)}
.leg{display:flex;gap:14px;padding:6px 24px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:.73rem;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px}
.ll{width:20px;height:2px;border-radius:1px}
#cw{padding:14px 16px 0}
#mc{width:100%;height:440px}
#rc{width:100%;height:130px;margin-top:2px}
#vc{width:100%;height:100px;margin-top:2px}
.ps{display:flex;gap:10px;padding:8px 24px;flex-wrap:wrap;font-size:.73rem;color:var(--mt)}
.pi{background:#21262d;border:1px solid var(--bd);border-radius:5px;padding:2px 8px}
.sp{display:flex;gap:14px;padding:12px 24px 14px;flex-wrap:wrap}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:10px 14px;flex:1;min-width:200px}
.sc h4{font-size:.73rem;font-weight:700;color:var(--mt);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.se{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #30363d44;font-size:.78rem}
.se:last-child{border-bottom:none}
.stb{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px}
.sbuy{background:#0f2a1a;color:var(--bu);border:1px solid #166534}
.ssel{background:#2a0f0f;color:var(--br);border:1px solid #6e1414}
#loading{position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;z-index:99;font-size:1rem;color:#8b949e}
footer{text-align:center;padding:12px;color:var(--mt);font-size:.7rem;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<div id="loading">載入資料中…</div>
<header>
  <div><h1>台指期（TXFPM1）多因子動量策略訊號</h1><p>QuantDinger × 台指期近月連續 ｜ 三時間框架 ｜ 資料截至 2026-05-05</p></div>
  <div class="live"><span class="pulse"></span>策略訊號</div>
</header>
<div class="ctrl">
  <div class="tabs">
    <button class="tab active" onclick="sw('d',this)">日線 (2023–)</button>
    <button class="tab" onclick="sw('h',this)">60 分鐘</button>
    <button class="tab" onclick="sw('m',this)">15 分鐘</button>
  </div>
  <div class="info">
    <div class="chip"><span class="dg"></span>買入</div>
    <div class="chip"><span class="dr"></span>賣出</div>
    <div class="chip" id="sc2"></div>
  </div>
</div>
<div class="leg">
  <div class="li"><div class="ll" style="background:#f0b429"></div>EMA 快</div>
  <div class="li"><div class="ll" style="background:#60a5fa"></div>EMA 慢</div>
  <div class="li"><div class="ll" style="background:#94a3b8;opacity:.6"></div>布林帶</div>
  <div class="li"><div class="ll" style="background:#22d3ee"></div>ATR止損(多)</div>
  <div class="li"><div class="ll" style="background:#fb923c"></div>ATR止損(空)</div>
  <div class="li" style="color:#26a641">▲ 買入</div>
  <div class="li" style="color:#f85149">▼ 賣出</div>
</div>
<div id="cw"><div id="mc"></div><div id="rc"></div><div id="vc"></div></div>
<div class="ps" id="ps"></div>
<div class="sp" id="sp"></div>
<footer>台指期多因子動量策略 ｜ QuantDinger IndicatorStrategy ｜ 僅供研究參考，非投資建議</footer>
<script>
const PL={d:["EMA 20/60","RSI>50","BB>3.5%","ATR 1.8x","無量能過濾","2023/01-2026/05"],
          h:["EMA 10/30","RSI>45/55","BB>2.0%","ATR 1.8x","無量能過濾","2026/03-05"],
          m:["EMA 15/40","RSI>45/55","BB>1.5%","ATR 1.8x","無量能過濾","2026/04-05"]};
const CFG={responsive:true,displayModeBar:false};
const BL={paper_bgcolor:'#0d1117',plot_bgcolor:'#0d1117',font:{color:'#e6edf3',size:11},
  margin:{l:52,r:12,t:6,b:0},hovermode:'x unified',
  hoverlabel:{bgcolor:'#161b22',bordercolor:'#30363d',font:{color:'#e6edf3',size:10}},
  legend:{bgcolor:'rgba(13,17,23,.85)',bordercolor:'#30363d',borderwidth:1,x:0,y:1,xanchor:'left',yanchor:'top',font:{size:9}},
  xaxis:{type:'category',showgrid:true,gridcolor:'#21262d',zeroline:false,tickfont:{size:9},color:'#8b949e',rangeslider:{visible:false},tickangle:-40},
  yaxis:{showgrid:true,gridcolor:'#21262d',zeroline:false,tickfont:{size:9},color:'#8b949e',side:'right'}};
let R=null;
function step(n){return n<=60?5:n<=200?15:n<=500?30:n<=1000?60:100}
function render(k){
  if(!R)return;
  const d=R[k],ts=d.t,n=ts.length,st=step(n);
  const tv=ts.filter((_,i)=>i%st===0);
  const ax={type:'category',showgrid:true,gridcolor:'#21262d',zeroline:false,tickfont:{size:9},color:'#8b949e',
    categoryorder:'array',categoryarray:ts,tickvals:tv,ticktext:tv,rangeslider:{visible:false},tickangle:-40};
  Plotly.react('mc',
    [{type:'scatter',mode:'lines',name:'BB上',x:ts,y:d.bu,line:{color:'#475569',width:1,dash:'dot'},hoverinfo:'skip',showlegend:false},
     {type:'scatter',mode:'lines',name:'BB下',x:ts,y:d.bl,line:{color:'#475569',width:1,dash:'dot'},fill:'tonexty',fillcolor:'rgba(148,163,184,.04)',hoverinfo:'skip',showlegend:false},
     {type:'scatter',mode:'lines',name:'止損(多)',x:ts,y:d.sl,line:{color:'#22d3ee',width:1,dash:'dash'},hoverinfo:'skip'},
     {type:'scatter',mode:'lines',name:'止損(空)',x:ts,y:d.ss,line:{color:'#fb923c',width:1,dash:'dash'},hoverinfo:'skip'},
     {type:'candlestick',name:'K線',x:ts,open:d.o,high:d.h,low:d.l,close:d.c,
      increasing:{line:{color:'#26a641',width:1},fillcolor:'#26a641'},
      decreasing:{line:{color:'#f85149',width:1},fillcolor:'#f85149'},showlegend:false},
     {type:'scatter',mode:'lines',name:'EMA快',x:ts,y:d.ef,line:{color:'#f0b429',width:1.5},hoverinfo:'skip'},
     {type:'scatter',mode:'lines',name:'EMA慢',x:ts,y:d.es,line:{color:'#60a5fa',width:1.5},hoverinfo:'skip'},
     {type:'scatter',mode:'markers+text',name:'買入',x:d.bt,y:d.bl2,
      text:d.bt.map(()=>'▲'),textposition:'bottom center',textfont:{color:'#26a641',size:15},
      marker:{symbol:'triangle-up',size:13,color:'#26a641',line:{color:'#fff',width:1}},
      customdata:d.bc,hovertemplate:'<b>買入</b><br>%{x}<br>收盤:%{customdata}<extra></extra>'},
     {type:'scatter',mode:'markers+text',name:'賣出',x:d.st,y:d.sh,
      text:d.st.map(()=>'▼'),textposition:'top center',textfont:{color:'#f85149',size:15},
      marker:{symbol:'triangle-down',size:13,color:'#f85149',line:{color:'#fff',width:1}},
      customdata:d.sc,hovertemplate:'<b>賣出</b><br>%{x}<br>收盤:%{customdata}<extra></extra>'}],
    Object.assign({},BL,{height:440,xaxis:Object.assign({},ax,{showticklabels:false}),
    yaxis:{...BL.yaxis,title:{text:'點',font:{size:9}}},margin:{l:52,r:12,t:8,b:0}}),CFG);
  Plotly.react('rc',
    [30,50,70].map(v=>({type:'scatter',mode:'lines',x:ts,y:Array(n).fill(v),
      line:{color:v===70?'#f85149':v===50?'#8b949e':'#26a641',width:.7,dash:'dot'},showlegend:false,hoverinfo:'skip'}))
    .concat([{type:'scatter',mode:'lines',name:'RSI',x:ts,y:d.rsi,line:{color:'#a855f7',width:1.5},showlegend:false}]),
    Object.assign({},BL,{height:130,xaxis:Object.assign({},ax,{showticklabels:false}),
    yaxis:{...BL.yaxis,range:[0,100],dtick:25,title:{text:'RSI',font:{size:9}}},margin:{l:52,r:12,t:0,b:0}}),CFG);
  Plotly.react('vc',
    [{type:'bar',name:'量比',x:ts,y:d.vr,marker:{color:d.vr.map(v=>v>1.25?'#26a64166':'#21262d99')},showlegend:false},
     {type:'scatter',mode:'lines',x:ts,y:Array(n).fill(1.25),line:{color:'#f0b42966',width:1,dash:'dot'},showlegend:false,hoverinfo:'skip'}],
    Object.assign({},BL,{height:100,xaxis:Object.assign({},ax,{showticklabels:true}),
    yaxis:{...BL.yaxis,title:{text:'量比',font:{size:9}}},margin:{l:52,r:12,t:0,b:36}}),CFG);
  document.getElementById('ps').innerHTML=PL[k].map(p=>`<div class="pi">${p}</div>`).join('');
  const bR=d.bt.map((t,i)=>`<div class="se"><span>${t}</span><span class="stb sbuy">買入</span><span style="color:#26a641;font-weight:700">${d.bc[i].toLocaleString()}</span></div>`).join('')||'<div class="se" style="color:var(--mt)">無訊號</div>';
  const sR=d.st.map((t,i)=>`<div class="se"><span>${t}</span><span class="stb ssel">賣出</span><span style="color:#f85149;font-weight:700">${d.sc[i].toLocaleString()}</span></div>`).join('')||'<div class="se" style="color:var(--mt)">無訊號</div>';
  document.getElementById('sp').innerHTML=`<div class="sc"><h4>買入（${d.bt.length}筆）</h4>${bR}</div><div class="sc"><h4>賣出（${d.st.length}筆）</h4>${sR}</div>`;
  document.getElementById('sc2').textContent=`買${d.bt.length} 賣${d.st.length}`;
}
function sw(k,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');render(k);}
fetch('taiex_data.json').then(r=>r.json()).then(j=>{R=j;document.getElementById('loading').style.display='none';render('d');}).catch(e=>{document.getElementById('loading').textContent='載入失敗: '+e;});
</script>
</body>
</html>
