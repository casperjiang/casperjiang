.info{margin-left:auto;display:flex;gap:10px;font-size:.75rem;color:var(--mt)}

.dg{width:7px;height:7px;border-radius:50%;background:var(--bu)}
.dr{width:7px;height:7px;border-radius:50%;background:var(--br)}
.leg{display:flex;gap:14px;padding:6px 24px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:.73rem;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px}
.ll{width:20px;height:2px;border-radius:1px}
#cw{padding:14px 16px 0}
#mc{width:100%;height:440px}
#rc{width:100%;height:130px;margin-top:2px}
#vc{width:100%;height:100px;margin-top:2px}
.ps{display:flex;gap:10px;padding:8px 24px;flex-wrap:wrap;font-size:.73rem;color:var(--mt)}
.pi{background:#21262d;border:1px solid var(--bd);border-radius:5px;padding:2px 8px}
.sp{display:flex;gap:14px;padding:12px 24px 14px;flex-wrap:wrap}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:10px 14px;flex:1;min-width:200px}
.sc h4{font-size:.73rem;font-weight:700;color:var(--mt);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.se{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #30363d44;font-size:.78rem}
.se:last-child{border-bottom:none}
.stb{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px}
.sbuy{background:#0f2a1a;color:var(--bu);border:1px solid #166534}
.ssel{background:#2a0f0f;color:var(--br);border:1px solid #6e1414}
#ld{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:12px}
#ld p{font-size:.95rem;color:#8b949e}
#lpg{width:200px;height:4px;background:#21262d;border-radius:2px;overflow:hidden}
#lbr{height:100%;background:#1f6feb;border-radius:2px;transition:width .4s}
footer{text-align:center;padding:12px;color:var(--mt);font-size:.7rem;border-top:1px solid var(--bd)}
</style>
