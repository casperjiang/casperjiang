<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台指期 策略訊號 K 線圖</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e;
    --bull:#26a641; --bear:#f85149;
    --ema1:#f0b429; --ema2:#60a5fa;
    --bb:#94a3b8; --sl:#fb923c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

  header{
    background:linear-gradient(135deg,#0d1117 0%,#1a1f2e 100%);
    border-bottom:1px solid var(--border);
    padding:20px 28px 16px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  header h1{font-size:1.25rem;font-weight:700;letter-spacing:.02em}
  header p{font-size:.78rem;color:var(--muted);margin-top:4px}
  .live-badge{
    display:flex;align-items:center;gap:6px;
    font-size:.75rem;font-weight:600;color:#4ade80;
    background:#0f2a1a;border:1px solid #166534;
    padding:4px 12px;border-radius:20px;
  }
  .pulse{width:7px;height:7px;border-radius:50%;background:#4ade80;
    animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .controls{
    display:flex;align-items:center;gap:10px;
    padding:12px 28px;
    background:var(--surface);border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .tab-group{display:flex;gap:4px}
  .tab{
    padding:6px 18px;border-radius:8px;cursor:pointer;
    font-size:.83rem;font-weight:600;border:1px solid var(--border);
    background:transparent;color:var(--muted);transition:.2s;
  }
  .tab:hover{background:#21262d;color:var(--text)}
  .tab.active{background:#1f6feb;border-color:#388bfd;color:#fff}

  .info-bar{
    margin-left:auto;display:flex;gap:16px;align-items:center;
    font-size:.78rem;color:var(--muted);
  }
  .info-chip{
    display:flex;align-items:center;gap:5px;
    background:#21262d;border:1px solid var(--border);
    padding:3px 10px;border-radius:6px;
  }
  .dot-g{width:7px;height:7px;border-radius:50%;background:var(--bull)}
  .dot-r{width:7px;height:7px;border-radius:50%;background:var(--bear)}

  .legend-row{
    display:flex;gap:18px;padding:8px 28px;
    background:var(--surface);border-bottom:1px solid var(--border);
    font-size:.76rem;flex-wrap:wrap;
  }
  .leg{display:flex;align-items:center;gap:5px}
  .leg-line{width:22px;height:2px;border-radius:1px}
  .leg-dash{width:22px;height:2px;border-radius:1px;
    background:repeating-linear-gradient(90deg,currentColor 0,currentColor 4px,transparent 4px,transparent 8px)}

  #chart-wrap{padding:16px 20px 0}
  #main-chart{width:100%;height:460px}
  #rsi-chart  {width:100%;height:140px;margin-top:2px}
  #vol-chart  {width:100%;height:110px;margin-top:2px}

  .signal-panel{
    display:flex;gap:16px;padding:14px 28px 16px;
    flex-wrap:wrap;
  }
  .sig-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px 16px;flex:1;min-width:220px;
  }
  .sig-card h4{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
  .sig-entry{
    display:flex;justify-content:space-between;align-items:center;
    padding:5px 0;border-bottom:1px solid var(--border)44;font-size:.81rem;
  }
  .sig-entry:last-child{border-bottom:none}
  .sig-tag{
    font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:5px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .sig-buy {background:#0f2a1a;color:var(--bull);border:1px solid #166534}
  .sig-sell{background:#2a0f0f;color:var(--bear);border:1px solid #6e1414}

  .params-strip{
    padding:8px 28px 14px;
    font-size:.75rem;color:var(--muted);
    display:flex;gap:20px;flex-wrap:wrap;
  }
  .param-item{background:#21262d;border:1px solid var(--border);border-radius:6px;padding:3px 10px}
  .param-val{color:var(--text);font-weight:600;margin-left:4px}

  footer{text-align:center;padding:14px;color:var(--muted);font-size:.72rem;border-top:1px solid var(--border)}
</style>
</head>
<body>

<header>
  <div>
    <h1>台指期（TXFPM1）多因子動量策略訊號</h1>
    <p>QuantDinger × 台指期近月連續 ｜ 三時間框架訊號標示</p>
  </div>
  <div class="live-badge"><span class="pulse"></span>資料截至 2026-05-05</div>
</header>

<div class="controls">
  <div class="tab-group">
    <button class="tab active" onclick="switchTab('day',this)">日線 (2023–)</button>
    <button class="tab" onclick="switchTab('h60',this)">60 分鐘</button>
    <button class="tab" onclick="switchTab('m15',this)">15 分鐘</button>
  </div>
  <div class="info-bar">
    <div class="info-chip"><span class="dot-g"></span>買入訊號</div>
    <div class="info-chip"><span class="dot-r"></span>賣出訊號</div>
    <div class="info-chip" id="sig-count">載入中…</div>
  </div>
</div>

<div class="legend-row">
  <div class="leg"><div class="leg-line" style="background:var(--ema1)"></div><span>EMA 快線</span></div>
  <div class="leg"><div class="leg-line" style="background:var(--ema2)"></div><span>EMA 慢線</span></div>
  <div class="leg"><div class="leg-dash" style="color:var(--bb)"></div><span>布林帶</span></div>
  <div class="leg"><div class="leg-line" style="background:#22d3ee"></div><span>ATR 止損（多單）</span></div>
  <div class="leg"><div class="leg-line" style="background:var(--sl)"></div><span>ATR 止損（空單）</span></div>
  <div class="leg"><div style="width:14px;height:14px;background:var(--bull);clip-path:polygon(50% 0%,100% 100%,0% 100%);transform:rotate(180deg)"></div><span>▲ 買入</span></div>
  <div class="leg"><div style="width:14px;height:14px;background:var(--bear);clip-path:polygon(50% 0%,100% 100%,0% 100%)"></div><span>▼ 賣出</span></div>
</div>

<div id="chart-wrap">
  <div id="main-chart"></div>
  <div id="rsi-chart"></div>
  <div id="vol-chart"></div>
</div>

<div class="params-strip" id="params-strip"></div>

<div class="signal-panel" id="signal-panel"></div>

<footer>台指期多因子動量策略 ｜ QuantDinger IndicatorStrategy ｜ 策略訊號僅供研究參考，非投資建議</footer>

const PARAM_LABELS = {
  day:  [{k:'EMA',v:'20/60'},{k:'RSI',v:'>50'},{k:'BB 寬',v:'>3.5%'},{k:'ATR 止損',v:'1.8×'},{k:'量能過濾',v:'關閉（日線）'},{k:'資料範圍',v:'2023/01–2026/05'}],
  h60:  [{k:'EMA',v:'10/30'},{k:'RSI',v:'>45/55'},{k:'BB 寬',v:'>2.0%'},{k:'ATR 止損',v:'1.8×'},{k:'量能過濾',v:'關閉'},{k:'資料範圍',v:'2026/03–2026/05'}],
  m15:  [{k:'EMA',v:'15/40'},{k:'RSI',v:'>45/55'},{k:'BB 寬',v:'>1.5%'},{k:'ATR 止損',v:'1.8×'},{k:'量能過濾',v:'關閉'},{k:'資料範圍',v:'2026/04–2026/05'}],
};

const CFG = {responsive:true, displayModeBar:false};
const LAYOUT_BASE = {
  paper_bgcolor:'#0d1117', plot_bgcolor:'#0d1117',
  font:{color:'#e6edf3', size:11},
  margin:{l:52,r:14,t:6,b:0},
  xaxis:{
    type:'category', showgrid:true,
    gridcolor:'#21262d', zeroline:false,
    tickfont:{size:10}, color:'#8b949e',
    rangeslider:{visible:false},
    tickangle:-40,
  },
  yaxis:{
    showgrid:true, gridcolor:'#21262d',
    zeroline:false, tickfont:{size:10},
    color:'#8b949e', side:'right',
  },
  legend:{bgcolor:'rgba(13,17,23,.85)',bordercolor:'#30363d',borderwidth:1,
    x:0,y:1,xanchor:'left',yanchor:'top',font:{size:10}},
  hovermode:'x unified',
  hoverlabel:{bgcolor:'#161b22',bordercolor:'#30363d',font:{color:'#e6edf3',size:11}},
};

let currentTab = 'day';

function makeTraces(key) {
  const d = RAW[key];
  const ts = d.time;

  // ── Candlestick ─────────────────────────────────────────────
  const candle = {
    type:'candlestick', name:'K線',
    x:ts, open:d.open, high:d.high, low:d.low, close:d.close,
    increasing:{line:{color:'#26a641',width:1}, fillcolor:'#26a641'},
    decreasing:{line:{color:'#f85149',width:1}, fillcolor:'#f85149'},
    hoverinfo:'x+text',
    showlegend:false,
  };

  const ema1 = {type:'scatter',mode:'lines',name:`EMA快`,x:ts,y:d.ema_fast,
    line:{color:'#f0b429',width:1.5},hoverinfo:'skip'};
  const ema2 = {type:'scatter',mode:'lines',name:`EMA慢`,x:ts,y:d.ema_slow,
    line:{color:'#60a5fa',width:1.5},hoverinfo:'skip'};

  const bbU = {type:'scatter',mode:'lines',name:'BB上軌',x:ts,y:d.bb_upper,
    line:{color:'#475569',width:1,dash:'dot'},hoverinfo:'skip',showlegend:false};
  const bbL = {type:'scatter',mode:'lines',name:'BB下軌',x:ts,y:d.bb_lower,
    line:{color:'#475569',width:1,dash:'dot'},
    fill:'tonexty',fillcolor:'rgba(148,163,184,.05)',
    hoverinfo:'skip',showlegend:false};

  const slLong = {type:'scatter',mode:'lines',name:'止損(多)',x:ts,y:d.sl_long,
    line:{color:'#22d3ee',width:1,dash:'dash'},hoverinfo:'skip',showlegend:true};
  const slShort= {type:'scatter',mode:'lines',name:'止損(空)',x:ts,y:d.sl_short,
    line:{color:'#fb923c',width:1,dash:'dash'},hoverinfo:'skip',showlegend:true};

  // ── Buy / Sell arrows ───────────────────────────────────────
  const buyTrace = {
    type:'scatter', mode:'markers+text', name:'▲ 買入',
    x: d.buy_ts, y: d.buy_low,
    text: d.buy_ts.map(t=>'▲'),
    textposition:'bottom center',
    textfont:{color:'#26a641',size:16},
    marker:{symbol:'triangle-up',size:14,color:'#26a641',
      line:{color:'#fff',width:1}},
    customdata: d.buy_close,
    hovertemplate:'<b>買入訊號</b><br>時間: %{x}<br>收盤: %{customdata}<extra></extra>',
  };
  const sellTrace = {
    type:'scatter', mode:'markers+text', name:'▼ 賣出',
    x: d.sell_ts, y: d.sell_high,
    text: d.sell_ts.map(t=>'▼'),
    textposition:'top center',
    textfont:{color:'#f85149',size:16},
    marker:{symbol:'triangle-down',size:14,color:'#f85149',
      line:{color:'#fff',width:1}},
    customdata: d.sell_close,
    hovertemplate:'<b>賣出訊號</b><br>時間: %{x}<br>收盤: %{customdata}<extra></extra>',
  };

  // ── RSI ─────────────────────────────────────────────────────
  const rsiTrace = {type:'scatter',mode:'lines',name:'RSI(14)',x:ts,y:d.rsi,
    line:{color:'#a855f7',width:1.5},showlegend:false};
  const rsi70 = {type:'scatter',mode:'lines',x:ts,y:Array(ts.length).fill(70),
    line:{color:'#f85149',width:.8,dash:'dot'},showlegend:false,hoverinfo:'skip'};
  const rsi50 = {type:'scatter',mode:'lines',x:ts,y:Array(ts.length).fill(50),
    line:{color:'#8b949e',width:.8,dash:'dot'},showlegend:false,hoverinfo:'skip'};
  const rsi30 = {type:'scatter',mode:'lines',x:ts,y:Array(ts.length).fill(30),
    line:{color:'#26a641',width:.8,dash:'dot'},showlegend:false,hoverinfo:'skip'};

  // ── Volume Ratio ────────────────────────────────────────────
  const volColors = d.vol_ratio.map(v => v > 1.25 ? '#26a641aa' : '#21262daa');
  const volTrace = {type:'bar',name:'成交量比',x:ts,y:d.vol_ratio,
    marker:{color:volColors},showlegend:false};
  const vol1 = {type:'scatter',mode:'lines',x:ts,y:Array(ts.length).fill(1.25),
    line:{color:'#f0b42966',width:1,dash:'dot'},showlegend:false,hoverinfo:'skip'};

  return {candle,ema1,ema2,bbU,bbL,slLong,slShort,buyTrace,sellTrace,
          rsiTrace,rsi70,rsi50,rsi30,volTrace,vol1};
}

function tickStep(n) {
  if(n <= 60)  return 5;
  if(n <= 200) return 15;
  if(n <= 500) return 30;
  if(n <= 1000)return 60;
  return 100;
}

function renderCharts(key) {
  const d = RAW[key];
  const t = makeTraces(key);
  const ts = d.time;
  const n = ts.length;
  const step = tickStep(n);
  const tickvals = ts.filter((_,i)=>i%step===0);

  const baseX = {
    type:'category', showgrid:true, gridcolor:'#21262d',
    zeroline:false, tickfont:{size:9}, color:'#8b949e',
    categoryorder:'array', categoryarray:ts,
    tickvals, ticktext:tickvals,
    rangeslider:{visible:false}, tickangle:-40,
  };

  // Main chart
  const mainLayout = Object.assign({}, LAYOUT_BASE, {
    height:460,
    xaxis:Object.assign({},baseX,{showticklabels:false}),
    yaxis:Object.assign({},LAYOUT_BASE.yaxis,{title:{text:'點',font:{size:10}}}),
    margin:{l:52,r:14,t:8,b:0},
  });
  Plotly.react('main-chart',
    [t.bbU,t.bbL,t.slLong,t.slShort,t.candle,t.ema1,t.ema2,t.buyTrace,t.sellTrace],
    mainLayout, CFG);

  // RSI chart
  const rsiLayout = Object.assign({}, LAYOUT_BASE, {
    height:140,
    xaxis:Object.assign({},baseX,{showticklabels:false}),
    yaxis:{...LAYOUT_BASE.yaxis,range:[0,100],dtick:25,title:{text:'RSI',font:{size:9}}},
    margin:{l:52,r:14,t:0,b:0},
  });
  Plotly.react('rsi-chart',[t.rsi30,t.rsi50,t.rsi70,t.rsiTrace],rsiLayout,CFG);

  // Vol chart
  const volLayout = Object.assign({}, LAYOUT_BASE, {
    height:110,
    xaxis:Object.assign({},baseX,{showticklabels:true}),
    yaxis:{...LAYOUT_BASE.yaxis,title:{text:'量比',font:{size:9}}},
    margin:{l:52,r:14,t:0,b:36},
  });
  Plotly.react('vol-chart',[t.volTrace,t.vol1],volLayout,CFG);

  // Params strip
  const ps = document.getElementById('params-strip');
  ps.innerHTML = PARAM_LABELS[key].map(p=>
    `<div class="param-item">${p.k}<span class="param-val">${p.v}</span></div>`
  ).join('');

  // Signal panel
  const sp = document.getElementById('signal-panel');
  const buyRows = d.buy_ts.map((t,i)=>
    `<div class="sig-entry"><span>${t}</span><span class="sig-tag sig-buy">買入</span><span style="color:#26a641;font-weight:700">${d.buy_close[i].toLocaleString()}</span></div>`
  ).join('') || '<div class="sig-entry" style="color:var(--muted)">— 無訊號 —</div>';
  const sellRows = d.sell_ts.map((t,i)=>
    `<div class="sig-entry"><span>${t}</span><span class="sig-tag sig-sell">賣出</span><span style="color:#f85149;font-weight:700">${d.sell_close[i].toLocaleString()}</span></div>`
  ).join('') || '<div class="sig-entry" style="color:var(--muted)">— 無訊號 —</div>';

  sp.innerHTML = `
    <div class="sig-card">
      <h4>▲ 買入訊號（${d.buy_ts.length} 筆）</h4>
      ${buyRows}
    </div>
    <div class="sig-card">
      <h4>▼ 賣出訊號（${d.sell_ts.length} 筆）</h4>
      ${sellRows}
    </div>
  `;

  document.getElementById('sig-count').textContent =
    `買 ${d.buy_ts.length} 賣 ${d.sell_ts.length}`;
}

function switchTab(key, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentTab = key;
  renderCharts(key);
}

// Initial render
renderCharts('day');
</script>
