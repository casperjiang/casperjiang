<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台指期 策略訊號 K 線圖 | QuantDinger</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#0d1117;--sf:#161b22;--bd:#30363d;--tx:#e6edf3;--mt:#8b949e;--bu:#26a641;--br:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif}
header{background:linear-gradient(135deg,#0d1117,#1a1f2e);border-bottom:1px solid var(--bd);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:1.15rem;font-weight:700}
header p{font-size:.75rem;color:var(--mt);margin-top:3px}
.live{display:flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;color:#4ade80;background:#0f2a1a;border:1px solid #166534;padding:3px 10px;border-radius:20px}
.pulse{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pl 2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs{display:flex;gap:3px}
.tab{padding:5px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:600;border:1px solid var(--bd);background:transparent;color:var(--mt)}
.tab.active{background:#1f6feb;border-color:#388bfd;color:#fff}
.info{margin-left:auto;display:flex;gap:10px;font-size:.75rem;color:var(--mt)}
.chip{display:flex;align-items:center;gap:4px;background:#21262d;border:1px solid var(--bd);padding:2px 8px;border-radius:5px}
.dg{width:7px;height:7px;border-radius:50%;background:var(--bu)}
.dr{width:7px;height:7px;border-radius:50%;background:var(--br)}
.leg{display:flex;gap:14px;padding:6px 24px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:.73rem;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px}
.ll{width:20px;height:2px;border-radius:1px}
#cw{padding:14px 16px 0}
#mc{width:100%;height:440px}
#rc{width:100%;height:130px;margin-top:2px}
#vc{width:100%;height:100px;margin-top:2px}
.ps{display:flex;gap:10px;padding:8px 24px;flex-wrap:wrap;font-size:.73rem;color:var(--mt)}
.pi{background:#21262d;border:1px solid var(--bd);border-radius:5px;padding:2px 8px}
.sp{display:flex;gap:14px;padding:12px 24px 14px;flex-wrap:wrap}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:10px 14px;flex:1;min-width:200px}
.sc h4{font-size:.73rem;font-weight:700;color:var(--mt);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.se{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #30363d44;font-size:.78rem}
.se:last-child{border-bottom:none}
.stb{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px}
.sbuy{background:#0f2a1a;color:var(--bu);border:1px solid #166534}
.ssel{background:#2a0f0f;color:var(--br);border:1px solid #6e1414}
#ld{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:12px}
#ld p{font-size:.95rem;color:#8b949e}
#lpg{width:200px;height:4px;background:#21262d;border-radius:2px;overflow:hidden}
#lbr{height:100%;background:#1f6feb;border-radius:2px;transition:width .4s}
footer{text-align:center;padding:12px;color:var(--mt);font-size:.7rem;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<div id="ld"><p id="lmsg">解壓縮中…</p><div id="lpg"><div id="lbr" style="width:10%"></div></div></div>
<header>
  <div><h1>台指期（TXFPM1）多因子動量策略訊號</h1><p>QuantDinger x 台指期近月連續 | EMA交叉+RSI確認 | 資料截至 2026-05-05</p></div>
  <div class="live"><span class="pulse"></span>策略訊號</div>
</header>
<div class="ctrl">
  <div class="tabs">
    <button class="tab active" onclick="sw('d',this)">日線 (近2年)</button>
    <button class="tab" onclick="sw('h',this)">EMA 10/30</button>
    <button class="tab" onclick="sw('m',this)">EMA 15/40</button>
  </div>
  <div class="info">
    <div class="chip"><span class="dg"></span>買入</div>
    <div class="chip"><span class="dr"></span>賣出</div>
    <div class="chip" id="sc2"></div>
  </div>
</div>
<div class="leg">
  <div class="li"><div class="ll" style="background:#f0b429"></div>EMA快</div>
  <div class="li"><div class="ll" style="background:#60a5fa"></div>EMA慢</div>
  <div class="li"><div class="ll" style="background:#94a3b8;opacity:.6"></div>布林帶</div>
  <div class="li"><div class="ll" style="background:#22d3ee"></div>ATR止損(多)</div>
  <div class="li"><div class="ll" style="background:#fb923c"></div>ATR止損(空)</div>
  <div class="li" style="color:#26a641">▲買入</div>
  <div class="li" style="color:#f85149">▼賣出</div>
</div>
<div id="cw"><div id="mc"></div><div id="rc"></div><div id="vc"></div></div>
<div class="ps" id="ps"></div>
<div class="sp" id="sp"></div>
<footer>台指期多因子動量策略 | QuantDinger IndicatorStrategy | 僅供研究參考，非投資建議 | 日線EMA20/60+RSI>50交叉訊號</footer>
